# Gradle JVM settings for PureQR
# This increases the heap size to 2GB to prevent "out of JVM heap space" errors during builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Enable parallel builds for better performance
org.gradle.parallel=true

# Enable caching of build results
org.gradle.caching=true

# Better IDE performance with Android Studio
android.useAndroidX=true
android.nonTransitiveRClass=true
